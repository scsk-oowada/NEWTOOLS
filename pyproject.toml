[project]
name = "newtools"
version = "0.1.0"
description = "新規案件向けツール群"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywin32",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
teams-schedule = "newtools.teams_schedule.cli:main"
file-stats = "newtools.file_stats.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
